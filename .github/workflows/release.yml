name: Release

# Push a tag like v0.2.0 to publish a signed APK as a GitHub Release:
#   git tag v0.2.0 && git push origin v0.2.0
# The newest one is always at https://github.com/JackG255/CarThing/releases/latest
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CARTHING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          CARTHING_VERSION: ${{ github.ref_name }}
          CARTHING_KEYSTORE: ${{ runner.temp }}/release.jks
          CARTHING_KEYSTORE_PASSWORD: ${{ secrets.CARTHING_KEYSTORE_PASSWORD }}
          CARTHING_KEY_ALIAS: ${{ secrets.CARTHING_KEY_ALIAS }}
          CARTHING_KEY_PASSWORD: ${{ secrets.CARTHING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the APKs
        run: |
          mkdir dist
          version="${GITHUB_REF_NAME#v}"
          # The arm64 build fits nearly every phone, so it gets the plain name friends should pick.
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/CarThing-$version.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/CarThing-$version-older-phones.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Install:** download `CarThing-<version>.apk` below on your phone and open it. Allow installs
          from your browser when asked; if Play Protect warns about an unknown app, choose *Install anyway*.
          Updating: install the new APK over the old one — your data stays.

          Very old or budget phone and the install fails? Use the `-older-phones` APK instead.
          EOF
          sed -i "s/<version>/${GITHUB_REF_NAME#v}/" notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "CarThing ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --generate-notes --latest
